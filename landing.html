<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EduNova | Sekolah Masa Depan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ==================== RESET & VARIABLES ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-blue: #0A2540;      /* biru tua utama untuk teks bold & aksen */
      --deep-blue: #1A3A5C;         /* biru medium untuk hover */
      --black-soft: #1A1A1A;        /* hitam lembut untuk teks utama */
      --gray-light: #F5F7FA;        /* abu sangat terang untuk bg card */
      --gray-border: #E2E8F0;        /* border tipis */
      --text-dark: #1A1A1A;          /* teks utama hitam */
      --text-muted: #4A5568;         /* teks sekunder abu gelap */
      --white: #FFFFFF;
      --accent-blue: #2C6B9E;        /* biru untuk hover & aksen */
      --shadow-sm: 0 10px 30px -12px rgba(0,0,0,0.08);
      --shadow-md: 0 20px 35px -10px rgba(0,0,0,0.1);
      --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--white);
      color: var(--text-dark);
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ==================== TYPOGRAPHY ==================== */
    h1, h2, h3, .logo, .nav-link {
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 800;
      line-height: 1.1;
      color: var(--primary-blue);
    }

    h2 {
      font-size: clamp(30px, 4.5vw, 44px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--primary-blue);
    }

    h3 {
      font-size: clamp(20px, 3.5vw, 24px);
      font-weight: 600;
      color: var(--primary-blue);
    }

    p, li, .text-body {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .gradient-text {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--accent-blue) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 48px;
      font-weight: 600;
      font-size: 14px;
      transition: var(--transition);
      cursor: pointer;
      text-decoration: none;
      border: 1.5px solid transparent;
    }

    .btn-primary {
      background: var(--primary-blue);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--deep-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .btn-outline {
      border-color: var(--primary-blue);
      color: var(--primary-blue);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--primary-blue);
      color: var(--white);
      transform: translateY(-2px);
    }

    .btn-arrow i {
      transition: transform 0.25s ease;
    }

    .btn-arrow:hover i {
      transform: translateX(6px);
    }

    /* ==================== NAVBAR ==================== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 20px 48px;
      transition: all 0.3s ease;
      background: transparent;
    }

    .navbar.scrolled {
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(10px);
      padding: 14px 48px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-blue);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-link {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: color 0.2s;
      position: relative;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary-blue);
      transition: width 0.3s ease;
    }

    .nav-link:hover {
      color: var(--primary-blue);
    }

    .nav-link:hover::after {
      width: 100%;
    }

    .menu-icon {
      display: none;
      font-size: 26px;
      color: var(--primary-blue);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .navbar { padding: 16px 24px; }
      .navbar.scrolled { padding: 12px 24px; }
      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 75%;
        height: 100vh;
        background: var(--white);
        flex-direction: column;
        padding: 100px 40px;
        transition: right 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        gap: 30px;
        z-index: 1001;
      }
      .nav-links.active { right: 0; }
      .menu-icon { display: block; z-index: 1002; }
    }

    /* ==================== HERO ==================== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      padding: 120px 48px 80px;
      background: linear-gradient(135deg, #F8FAFE 0%, #FFFFFF 100%);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 0 24px;
    }

    .hero-content {
      max-width: 650px;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(10,37,64,0.08);
      padding: 6px 16px;
      border-radius: 60px;
      font-size: 13px;
      font-weight: 500;
      color: var(--primary-blue);
      margin-bottom: 32px;
    }

    .hero-badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-blue);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hero-title {
      margin-bottom: 28px;
    }

    .hero-sub {
      font-size: 18px;
      margin-bottom: 40px;
      max-width: 520px;
    }

    .hero-buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .hero-stats {
      display: flex;
      gap: 48px;
      margin-top: 70px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-number {
      font-size: 36px;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .hero-illustration {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      width: 400px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 1024px) {
      .hero-illustration { display: none; }
    }
    @media (max-width: 768px) {
      .hero { padding: 100px 24px 60px; text-align: center; }
      .hero-content { max-width: 100%; }
      .hero-sub { margin-left: auto; margin-right: auto; }
      .hero-buttons { justify-content: center; }
      .hero-stats { justify-content: center; flex-wrap: wrap; gap: 32px; }
    }

    /* ==================== SECTION & CARDS ==================== */
    section {
      padding: 80px 0;
    }

    .section-header {
      text-align: center;
      margin-bottom: 56px;
    }

    .section-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-blue);
      margin-bottom: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 32px;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--gray-border);
      border-radius: 24px;
      padding: 32px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--primary-blue);
      box-shadow: var(--shadow-md);
    }

    .card-icon {
      font-size: 42px;
      color: var(--primary-blue);
      margin-bottom: 24px;
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      margin-bottom: 20px;
    }

    .card-link {
      color: var(--primary-blue);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: gap 0.3s;
    }

    .card-link i {
      transition: transform 0.3s;
    }

    .card-link:hover {
      gap: 12px;
    }

    .card-link:hover i {
      transform: translateX(4px);
    }

    /* ==================== GALLERY ==================== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .gallery-item {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      aspect-ratio: 4/3;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,37,64,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    /* ==================== CTA ==================== */
    .cta-section {
      background: linear-gradient(135deg, var(--primary-blue) 0%, var(--deep-blue) 100%);
      border-radius: 32px;
      margin: 40px auto;
      padding: 70px 40px;
      text-align: center;
      max-width: 1280px;
    }

    .cta-section h2 {
      color: var(--white);
      margin-bottom: 20px;
    }

    .cta-section p {
      color: rgba(255,255,255,0.85);
      margin-bottom: 32px;
    }

    .cta-section .btn-primary {
      background: var(--white);
      color: var(--primary-blue);
    }

    .cta-section .btn-primary:hover {
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px);
    }

    /* ==================== FOOTER ==================== */
    .footer {
      background: var(--gray-light);
      padding: 64px 0 32px;
      border-top: 1px solid var(--gray-border);
      margin-top: 40px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 48px;
      margin-bottom: 48px;
    }

    .footer-col h4 {
      font-size: 18px;
      color: var(--primary-blue);
      margin-bottom: 20px;
    }

    .footer-col p, .footer-col a {
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: none;
      display: block;
      margin-bottom: 10px;
      transition: color 0.2s;
    }

    .footer-col a:hover {
      color: var(--primary-blue);
    }

    .footer-bottom {
      text-align: center;
      padding-top: 32px;
      border-top: 1px solid var(--gray-border);
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ==================== SCROLL REVEAL ==================== */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 640px) {
      .grid-3 { grid-template-columns: 1fr; }
      .cta-section { margin: 20px 16px; padding: 48px 24px; }
      .btn { padding: 12px 24px; }
      section { padding: 60px 0; }
    }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#" class="logo" data-page="beranda">EduNova</a>
      <div class="menu-icon" id="menuIcon"><i class="fas fa-bars"></i></div>
      <ul class="nav-links" id="navLinks">
        <li><a href="#" data-page="beranda" class="nav-link">Beranda</a></li>
        <li><a href="#" data-page="profil" class="nav-link">Profil</a></li>
        <li><a href="#" data-page="program" class="nav-link">Program</a></li>
        <li><a href="#" data-page="fasilitas" class="nav-link">Fasilitas</a></li>
        <li><a href="#" data-page="galeri" class="nav-link">Galeri</a></li>
        <li><a href="#" data-page="kontak" class="nav-link">Kontak</a></li>
        <li><a href="#" data-page="pendaftaran" class="nav-link btn-outline" style="border-color: var(--primary-blue);">Daftar</a></li>
      </ul>
    </div>
  </nav>

  <main id="app"></main>

  <script>
    // DATA DUMMY
    const beritaData = [
      { id:1, judul:"Prestasi Olimpiade Sains Internasional", tgl:"12 Mei 2025", excerpt:"Siswa kami berhasil meraih medali emas di ajang Olimpiade Sains Dunia.", img:"https://picsum.photos/id/20/600/400" },
      { id:2, judul:"Workshop AI & Robotics", tgl:"5 April 2025", excerpt:"Pelatihan intensif kecerdasan buatan bersama praktisi global.", img:"https://picsum.photos/id/26/600/400" },
      { id:3, judul:"Penerimaan Siswa Baru 2026", tgl:"1 Maret 2025", excerpt:"Gelombang pertama pendaftaran telah dibuka untuk tahun ajaran 2026.", img:"https://picsum.photos/id/28/600/400" }
    ];
    const galeriFoto = [
      "https://picsum.photos/id/1/500/400","https://picsum.photos/id/15/500/450","https://picsum.photos/id/22/500/420","https://picsum.photos/id/42/500/500","https://picsum.photos/id/77/500/380","https://picsum.photos/id/96/500/360"
    ];
    const fasilitasList = [
      { nama:"Lab VR & AI", desc:"Teknologi immersive untuk pembelajaran interaktif dan eksperimen digital.", icon:"fas fa-vr-cardboard" },
      { nama:"Perpustakaan 4.0", desc:"Akses jurnal internasional, e-book, dan ruang diskusi digital.", icon:"fas fa-book-open" },
      { nama:"Arena Olahraga", desc:"Futsal, basket, kolam renang, dan fasilitas fitness premium.", icon:"fas fa-futbol" }
    ];
    const programList = [
      { nama:"Sains & Teknologi", desc:"Fokus AI, robotika, data science, dan penelitian digital.", icon:"fas fa-microchip" },
      { nama:"Bisnis Digital", desc:"Startup, e-commerce, digital marketing, dan kewirausahaan.", icon:"fas fa-chart-line" },
      { nama:"Seni & Desain", desc:"Motion graphic, UI/UX design, fotografi, dan produksi film.", icon:"fas fa-palette" }
    ];

    let currentPage = "beranda";

    function renderPage(page) {
      const app = document.getElementById("app");
      if(page === "beranda") app.innerHTML = renderHome();
      else if(page === "profil") app.innerHTML = renderProfil();
      else if(page === "program") app.innerHTML = renderProgram();
      else if(page === "fasilitas") app.innerHTML = renderFasilitas();
      else if(page === "galeri") app.innerHTML = renderGaleri();
      else if(page === "kontak") app.innerHTML = renderKontak();
      else if(page === "pendaftaran") app.innerHTML = renderPendaftaran();
      else app.innerHTML = renderHome();
      attachPageEvents(page);
      initRevealObserver();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function attachPageEvents(page) {
      if(page === "galeri") {
        const items = document.querySelectorAll('.gallery-item');
        items.forEach(item => {
          item.addEventListener('click', () => {
            const imgSrc = item.querySelector('img').src;
            showLightbox(imgSrc);
          });
        });
      }
      if(page === "pendaftaran") initMultiStep();
    }

    function showLightbox(src) {
      let lb = document.getElementById('globalLightbox');
      if(!lb) {
        lb = document.createElement('div');
        lb.id = "globalLightbox";
        lb.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:10000;display:none;align-items:center;justify-content:center;cursor:pointer;";
        lb.innerHTML = '<img id="lightboxImg" style="max-width:90%;max-height:90%;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.3);">';
        document.body.appendChild(lb);
        lb.addEventListener('click', () => lb.style.display = 'none');
      }
      const img = document.getElementById('lightboxImg');
      img.src = src;
      lb.style.display = 'flex';
    }

    let step = 1;
    function initMultiStep() {
      const steps = document.querySelectorAll('.step-form');
      const fill = document.querySelector('.progress-fill');
      function update() {
        steps.forEach((st, idx) => st.classList.toggle('active-step', idx+1 === step));
        if(fill) fill.style.width = ((step-1)/(steps.length-1))*100 + '%';
      }
      window.nextStep = function() { if(step < steps.length) { step++; update(); } };
      window.prevStep = function() { if(step > 1) { step--; update(); } };
      const form = document.getElementById('regForm');
      if(form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if(step === steps.length) alert("✅ Pendaftaran berhasil! Admin akan menghubungi Anda.");
          else nextStep();
        });
      }
      update();
    }

    function initRevealObserver() {
      const reveals = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if(entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.12, rootMargin: "0px 0px -30px 0px" });
      reveals.forEach(el => observer.observe(el));
    }

    // RENDER FUNCTIONS
    function renderHome() {
      return `
        <section class="hero">
          <div class="hero-content container">
            <div class="hero-badge"><span class="hero-badge-dot"></span> Since 2015 · Terakreditasi A</div>
            <h1 class="hero-title">Tempat Berkembangnya <span class="gradient-text">Generasi Masa Depan</span></h1>
            <p class="hero-sub">Kurikulum bertaraf global, pendekatan berbasis teknologi, dan lingkungan yang mendukung kreativitas tanpa batas.</p>
            <div class="hero-buttons">
              <a href="#" data-page="pendaftaran" class="btn btn-primary btn-arrow">Daftar Sekarang <i class="fas fa-arrow-right"></i></a>
              <a href="#" data-page="program" class="btn btn-outline btn-arrow">Lihat Program <i class="fas fa-arrow-right"></i></a>
            </div>
            <div class="hero-stats">
              <div class="stat-item"><span class="stat-number">500+</span><span class="stat-label">Siswa Aktif</span></div>
              <div class="stat-item"><span class="stat-number">35+</span><span class="stat-label">Prestasi</span></div>
              <div class="stat-item"><span class="stat-number">99%</span><span class="stat-label">Penerimaan PTN</span></div>
            </div>
          </div>
          <div class="hero-illustration">
            <svg width="320" height="320" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="150" cy="150" r="120" stroke="#0A2540" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
              <circle cx="150" cy="150" r="80" stroke="#0A2540" stroke-width="1" opacity="0.2"/>
              <circle cx="150" cy="150" r="40" fill="#0A2540" fill-opacity="0.05" stroke="#0A2540" stroke-width="1"/>
              <path d="M150 60 L180 100 L150 140 L120 100 Z" fill="#0A2540" fill-opacity="0.15"/>
              <circle cx="150" cy="100" r="4" fill="#0A2540"/>
            </svg>
          </div>
        </section>

        <div class="container"><div style="height:10px;"></div></div>

        <section><div class="container"><div class="section-header reveal"><span class="section-tag">Tentang Kami</span><h2>Mencetak Pemimpin <span class="gradient-text">Digital</span></h2></div><div class="grid-3 reveal">${[1,2,3].map(i=>`<div class="card"><i class="fas fa-graduation-cap card-icon"></i><h3>Visi & Misi</h3><p>Menciptakan generasi unggul yang berdaya saing global dengan berlandaskan integritas dan inovasi.</p><a href="#" class="card-link">Selengkapnya <i class="fas fa-arrow-right"></i></a></div>`).join('')}</div></div></section>

        <section style="background: #F8FAFE;"><div class="container"><div class="section-header reveal"><span class="section-tag">Program Unggulan</span><h2>Pilihan <span class="gradient-text">Kompetensi</span></h2></div><div class="grid-3 reveal">${programList.map(p=>`<div class="card"><i class="${p.icon} card-icon"></i><h3>${p.nama}</h3><p>${p.desc}</p><a href="#" class="card-link">Jelajahi <i class="fas fa-arrow-right"></i></a></div>`).join('')}</div></div></section>

        <section><div class="container"><div class="section-header reveal"><span class="section-tag">Fasilitas</span><h2>Lingkungan <span class="gradient-text">Premium</span></h2></div><div class="grid-3 reveal">${fasilitasList.map(f=>`<div class="card"><i class="${f.icon} card-icon"></i><h3>${f.nama}</h3><p>${f.desc}</p></div>`).join('')}</div></div></section>

        <section style="background: #F8FAFE;"><div class="container"><div class="section-header reveal"><span class="section-tag">Galeri Kegiatan</span><h2>Momen <span class="gradient-text">Terbaik</span></h2></div><div class="gallery-grid reveal">${galeriFoto.slice(0,6).map(url=>`<div class="gallery-item"><img src="${url}" alt="galeri"><div class="gallery-overlay"><i class="fas fa-search-plus" style="font-size:28px;color:white;"></i></div></div>`).join('')}</div></div></section>

        <section><div class="container"><div class="section-header reveal"><span class="section-tag">Berita & Artikel</span><h2>Update <span class="gradient-text">Terkini</span></h2></div><div class="grid-3 reveal">${beritaData.map(b=>`<div class="card"><img src="${b.img}" style="width:100%;height:180px;object-fit:cover;border-radius:16px;margin-bottom:20px;"><h3>${b.judul}</h3><p style="font-size:13px;color:#7C8B9B;">${b.tgl}</p><p>${b.excerpt.substring(0,85)}...</p><a href="#" class="card-link">Baca <i class="fas fa-arrow-right"></i></a></div>`).join('')}</div></div></section>

        <div class="cta-section reveal"><div class="container"><h2>Siap Bergabung <span style="color:white;">Bersama Kami?</span></h2><p>Daftarkan dirimu sekarang dan raih masa depan gemilang bersama EduNova.</p><a href="#" data-page="pendaftaran" class="btn btn-primary btn-arrow">Daftar Sekarang <i class="fas fa-arrow-right"></i></a></div></div>

        ${renderFooter()}
      `;
    }

    function renderProfil() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Profil Sekolah</h1><p style="font-size:18px; margin-top:12px;">Unggul dalam prestasi, berkarakter global</p></div></section>
      <div class="container"><section><div class="reveal"><h2>Sambutan Kepala Sekolah</h2><div style="display:flex; gap:32px; flex-wrap:wrap; margin-top:24px;"><img src="https://randomuser.me/api/portraits/men/32.jpg" style="border-radius:100%; width:100px; height:100px; object-fit:cover;"><div><p>"Selamat datang di EduNova, sekolah yang mengedepankan inovasi, karakter, dan kecakapan abad 21. Bersama kita cetak generasi unggul."</p><p style="margin-top:12px; font-weight:600;">— Dr. Andi Wijaya, M.Pd.</p></div></div></div></section>
      <section><div class="grid-3 reveal"><div class="card"><h3>Visi</h3><p>Menjadi pusat pendidikan digital unggulan tingkat Asia yang melahirkan pemimpin teknologi berakhlak mulia.</p></div><div class="card"><h3>Misi</h3><p>1. Kurikulum berbasis AI & proyek nyata.<br>2. Kolaborasi global dengan mitra industri.<br>3. Pembentukan karakter dan integritas.</p></div><div class="card"><h3>Sejarah</h3><p>Berdiri sejak 2015, telah meluluskan lebih dari 2000 siswa yang tersebar di universitas top dunia seperti UI, ITB, dan luar negeri.</p></div></div></section>
      <section><h2 class="reveal">Struktur Organisasi</h2><div class="grid-3 reveal">${[1,2,3].map(i=>`<div class="card"><i class="fas fa-user-tie card-icon"></i><h3>Nama Pengurus ${i}</h3><p>Jabatan: Kepala Divisi ${i}</p><p>Pendidikan: S2 Manajemen Pendidikan</p></div>`).join('')}</div></section></div>${renderFooter()}`;
    }

    function renderProgram() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Program Keahlian</h1><p style="font-size:18px; margin-top:12px;">Temukan passionmu di sini</p></div></section>
      <div class="container"><section><div class="grid-3 reveal">${programList.map(p=>`<div class="card"><i class="${p.icon} card-icon"></i><h3>${p.nama}</h3><p>${p.desc} Durasi 3 tahun, kurikulum berbasis proyek, magang industri, dan sertifikasi.</p><div style="margin-top:20px;"><i class="fas fa-check-circle" style="color:#0A2540;"></i> Sertifikasi Internasional</div></div>`).join('')}</div></section>
      <section><div class="card reveal"><h3>Biaya Pendidikan (Referensi)</h3><table style="width:100%; border-collapse:collapse;"><tr><td style="padding:12px 0;">Program Reguler</td><td style="text-align:right;">Rp 12.000.000/tahun</td></tr><tr><td style="padding:12px 0;">Program Akselerasi</td><td style="text-align:right;">Rp 18.500.000/tahun</td></tr><tr><td style="padding:12px 0;">Beasiswa Prestasi</td><td style="text-align:right;">Potongan 50% - 100%</td></tr></table></div></section></div>${renderFooter()}`;
    }

    function renderFasilitas() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Fasilitas Lengkap</h1><p style="font-size:18px; margin-top:12px;">Didukung sarana modern & nyaman</p></div></section>
      <div class="container"><div class="grid-3 reveal">${fasilitasList.map(f=>`<div class="card"><i class="${f.icon} card-icon"></i><h3>${f.nama}</h3><p>${f.desc} dengan standar internasional dan akses 24/7.</p><img src="https://picsum.photos/id/91/400/200" style="width:100%; border-radius:16px; margin-top:16px;"></div>`).join('')}</div></div>${renderFooter()}`;
    }

    function renderGaleri() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Galeri Kegiatan</h1><p style="font-size:18px; margin-top:12px;">Momen inspiratif siswa kami</p></div></section>
      <div class="container"><div class="gallery-grid reveal">${galeriFoto.map(url=>`<div class="gallery-item"><img src="${url}" alt="galeri"><div class="gallery-overlay"><i class="fas fa-expand"></i></div></div>`).join('')}</div></div>${renderFooter()}`;
    }

    function renderKontak() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Hubungi Kami</h1><p style="font-size:18px; margin-top:12px;">Kami siap membantu Anda</p></div></section>
      <div class="container"><div class="grid-3 reveal"><div class="card"><i class="fas fa-map-marker-alt card-icon"></i><h3>Alamat</h3><p>Jl. Pendidikan No.45, Jakarta Selatan</p></div><div class="card"><i class="fas fa-phone-alt card-icon"></i><h3>Telepon</h3><p>+62 812 3456 7890</p><p>+62 21 12345678</p></div><div class="card"><i class="fas fa-envelope card-icon"></i><h3>Email</h3><p>info@edunova.sch.id</p><p>psb@edunova.sch.id</p></div></div>
      <div class="card reveal" style="margin-top:32px;"><h3>Kirim Pesan</h3><form id="contactForm"><input type="text" placeholder="Nama" style="width:100%; margin-bottom:16px; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"><input type="email" placeholder="Email" style="width:100%; margin-bottom:16px; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"><textarea rows="4" placeholder="Pesan" style="width:100%; margin-bottom:16px; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"></textarea><button type="submit" class="btn btn-primary">Kirim Pesan</button></form></div>
      <div style="margin:48px 0; border-radius:24px; overflow:hidden; box-shadow:var(--shadow-sm);"><iframe width="100%" height="300" style="border:0;" loading="lazy" src="https://maps.google.com/maps?q=Jakarta&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe></div></div>${renderFooter()}`;
    }

    function renderPendaftaran() {
      return `<section style="padding:140px 0 60px; background:#F8FAFE;"><div class="container"><h1>Pendaftaran Online</h1><p style="font-size:18px; margin-top:12px;">Isi data dengan benar</p></div></section>
      <div class="container"><div class="card reveal"><div class="progress-bar" style="height:6px; background:#E2E8F0; border-radius:6px; margin-bottom:32px;"><div class="progress-fill" style="width:0%; height:100%; background:var(--primary-blue); border-radius:6px;"></div></div>
      <form id="regForm"><div class="step-form active-step"><h3>Data Pribadi</h3><input type="text" placeholder="Nama Lengkap" required style="width:100%; margin:12px 0; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"><input type="text" placeholder="NISN / No Registrasi" style="width:100%; margin:12px 0; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"></div>
      <div class="step-form"><h3>Pilihan Program</h3><select style="width:100%; padding:14px; border-radius:16px; border:1px solid #E2E8F0;"><option>Sains & Teknologi</option><option>Bisnis Digital</option><option>Seni & Desain</option></select></div>
      <div class="step-form"><h3>Unggah Berkas</h3><input type="file" style="margin:12px 0;"></div>
      <div class="step-form"><h3>Konfirmasi</h3><p>Pastikan data sudah benar. Pendaftaran akan diproses dalam 3 hari kerja.</p><label style="display:flex; align-items:center; gap:10px; margin-top:16px;"><input type="checkbox"> Saya menyetujui kebijakan sekolah</label></div>
      <div style="display:flex; justify-content:space-between; margin-top:28px;"><button type="button" class="btn-outline" onclick="prevStep()">Kembali</button><button type="submit" class="btn-primary">Selanjutnya / Daftar</button></div></form></div></div>${renderFooter()}`;
    }

    function renderFooter() {
      return `<footer class="footer"><div class="container"><div class="footer-grid"><div class="footer-col"><h4>EduNova</h4><p>Sekolah digital premium dengan visi global dan kurikulum masa depan.</p></div><div class="footer-col"><h4>Program</h4><a href="#">Sains & Teknologi</a><a href="#">Bisnis Digital</a><a href="#">Seni & Desain</a></div><div class="footer-col"><h4>Tautan Cepat</h4><a href="#">PPDB 2026</a><a href="#">Karir</a><a href="#">Beasiswa</a></div><div class="footer-col"><h4>Kontak</h4><p>📞 +62 812 3456 7890</p><p>✉️ info@edunova.sch.id</p></div></div><div class="footer-bottom"><span>© 2025 EduNova — All rights reserved. Designed with clean aesthetics.</span></div></div></footer>`;
    }

    // ROUTING & NAVIGATION
    document.querySelectorAll("[data-page]").forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.getAttribute('data-page');
        if(page) { currentPage = page; renderPage(page); }
        const mobileMenu = document.getElementById('navLinks');
        if(mobileMenu && mobileMenu.classList.contains('active')) mobileMenu.classList.remove('active');
      });
    });

    window.addEventListener('scroll', () => {
      const nav = document.getElementById('navbar');
      if(window.scrollY > 30) nav.classList.add('scrolled');
      else nav.classList.remove('scrolled');
    });

    const menuIcon = document.getElementById('menuIcon');
    const navLinks = document.getElementById('navLinks');
    if(menuIcon) menuIcon.addEventListener('click', () => navLinks.classList.toggle('active'));

    renderPage('beranda');
  </script>
</body>
</html>
